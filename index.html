function hexToRgba(hex, alpha){
  const h = hex.replace('#','');
  const r = parseInt(h.substring(0,2),16), g = parseInt(h.substring(2,4),16), b = parseInt(h.substring(4,6),16);
  return `rgba(${r},${g},${b},${alpha})`;
}

// Vertical fade-to-transparent fill, used for the Cumulative Index area chart.
function fadeGradient(hex, opacity){
  return (ctx)=>{
    const {chart} = ctx;
    const area = chart.chartArea;
    if(!area) return hexToRgba(hex, 0);
    const g = chart.ctx.createLinearGradient(0, area.top, 0, area.bottom);
    g.addColorStop(0, hexToRgba(hex, opacity));
    g.addColorStop(1, hexToRgba(hex, 0));
    return g;
  };
}

function baseTicks(extra){

// Generic reference-line plugin. Config passed per-chart via options.refLinesConfig = { lines: [...] }
// Each line: { axis:'x'|'y', axisId:'x'|'y', value: number (data value OR category index), color, dash:[..], label, labelColor }
const refLinesPlugin = {
  id: 'refLines',
  afterDraw(chart){
    const cfg = chart.options.refLinesConfig;
    if(!cfg || !cfg.lines || !cfg.lines.length) return;
    const {ctx, chartArea} = chart;
    if(!chartArea) return;
    ctx.save();
    cfg.lines.forEach(l=>{
      const scale = chart.scales[l.axisId];
      if(!scale) return;
      const pixel = scale.getPixelForValue(l.value);
      ctx.beginPath();
      ctx.setLineDash(l.dash||[]);
      ctx.strokeStyle = l.color;
      ctx.lineWidth = l.width||1.5;
      if(scale.axis === 'y'){
        ctx.moveTo(chartArea.left, pixel);
        ctx.lineTo(chartArea.right, pixel);
      } else {
        ctx.moveTo(pixel, chartArea.top);
        ctx.lineTo(pixel, chartArea.bottom);
      }
      ctx.stroke();
      if(l.label){
        ctx.setLineDash([]);
        ctx.font = "9px " + MONO;
        ctx.fillStyle = l.labelColor || l.color;
        if(scale.axis==='y'){
          ctx.textAlign='right'; ctx.textBaseline='bottom';
          ctx.fillText(l.label, chartArea.right-4, pixel-3);
        } else {
          ctx.textAlign='center'; ctx.textBaseline='top';
          ctx.fillText(l.label, pixel, chartArea.top+3);
        }
      }
    });
    ctx.restore();
  }
};

// Builds a <div class="chart-box" style="height:Npx"><canvas></canvas></div>, returns the canvas element after insertion.
function chartBox(container, id, height){
  const div = document.createElement('div');
  div.className = 'chart-box';
  div.style.height = height + 'px';
  div.innerHTML = `<canvas id="${id}"></canvas>`;
  container.appendChild(div);
  return div.querySelector('canvas');
}

function contextFor(y){
  if(y===2005) return 'Baseline';
  if(y===2010) return 'Post-recession recovery';
  if(y===2015) return 'Mid-decade, prices rising';
  if(y===2019) return 'Pre-COVID, stable';
  if(y===2021) return 'COVID surge begins';
  if(y===2022) return 'PEAK — worst affordability on record';
  if(y===2023) return 'Bust — discounts accelerate';
  return '2024 — entry at 20-yr best; wages winning';
}

function updateWageCalc(){
  const presetsEl = document.getElementById('wage-presets');
  const resultsEl = document.getElementById('wage-results-grid');
  const warnEl = document.getElementById('wage-minwarning');
  if(!presetsEl || !resultsEl || !warnEl) return;  // not currently on this tab

  const myWage = state.myWage;
  const calcEntry = parseFloat((750 / myWage).toFixed(1));
  const calcMid   = parseFloat((3500 / myWage).toFixed(1));
  const calcPrem  = parseFloat((7800 / myWage).toFixed(1));
  const base05Entry = parseFloat((450 / 15.89).toFixed(1));
  const base05Mid   = parseFloat((1800 / 15.89).toFixed(1));
  const base05Prem  = parseFloat((3500 / 15.89).toFixed(1));
  const minWageEntry = parseFloat((750 / 7.25).toFixed(1));
  const minWageMid   = parseFloat((3500 / 7.25).toFixed(1));

  presetsEl.innerHTML = WAGE_PRESETS.map(p=>`
    <button class="preset-btn ${Math.abs(myWage-p.val)<0.1?'active':''}" onclick="setMyWage(${p.val}, true)">
      ${p.label}<span class="note">${p.note}</span>
    </button>
  `).join('');

  const tiers = [
    { price:750, hrs:calcEntry, base:base05Entry, col:'#22c55e', label:'Entry Hardtail', note:'Trek Marlin / Rockhopper class' },
    { price:3500, hrs:calcMid, base:base05Mid, col:'#f97316', label:'Mid-Range Full-Sus', note:'Stumpjumper Comp / Fuel EX class' },
    { price:7800, hrs:calcPrem, base:base05Prem, col:'#a78bfa', label:'Premium Enduro', note:'Yeti SB150 / Megatower class' },
  ];
  resultsEl.innerHTML = tiers.map(t=>{
    const diff = t.hrs - t.base;
    const pct = ((t.hrs/t.base)-1)*100;
    const diffColor = diff<=0 ? '#22c55e' : diff<20 ? '#f59e0b' : '#ef4444';
    const diffText = diff<=0 ? `▼ ${Math.abs(diff).toFixed(1)} fewer hours` : `▲ ${diff.toFixed(1)} more hours`;
    return `
      <div style="background:var(--inset);border:1px solid ${t.col}33;border-radius:7px;padding:14px 16px">
        <div style="font-size:9px;color:var(--dim3);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:6px">${t.label}</div>
        <div style="font-family:var(--disp);font-size:30px;color:${t.col};font-weight:700;line-height:1">${t.hrs} <span style="font-size:14px;font-weight:400">hrs</span></div>
        <div style="font-size:10px;color:var(--dim2);margin-top:4px">at $${myWage.toFixed(2)}/hr for $${t.price.toLocaleString()} MSRP</div>
        <div style="margin-top:10px;padding-top:10px;border-top:1px solid var(--border-soft);font-size:10px">
          <div style="color:var(--dim5);margin-bottom:3px">vs. 2005 average worker:</div>
          <div style="color:${diffColor};font-weight:600">${diffText}<span style="color:var(--dim5);font-weight:400;font-size:9px"> (${pct>=0?'+':''}${pct.toFixed(1)}%)</span></div>
          <div style="color:var(--dim5);font-size:9px;margin-top:2px">2005 baseline: ${t.base} hrs @ $15.89/hr</div>
        </div>
      </div>
    `;
  }).join('');

  warnEl.innerHTML = myWage < 10 ? `
    <div style="margin-top:14px;padding:10px 14px;background:#1a0505;border:1px solid #ef444433;border-radius:6px;font-size:10px;color:#ef4444;line-height:1.7">
      ⚠ At the federal minimum wage of $7.25/hr (frozen since 2009), an entry hardtail requires ${minWageEntry} hours of work and a mid-range bike requires ${minWageMid} hours. At $7.25/hr in 2005 ($5.15/hr then), the same entry bike cost ${(450/5.15).toFixed(0)} hours. The sport has become less accessible at the wage floor due to frozen federal minimum wage policy.
    </div>
  ` : '';
}

// ─── INIT ────────────────────────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', renderShell);
</script>
</body>
